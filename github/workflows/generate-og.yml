name: Generate OG pages untuk Berita

on:
  # Jalan otomatis tiap 30 menit, cek kalau ada berita baru/diubah di Supabase
  schedule:
    - cron: "*/30 * * * *"
  # Jalan tiap kali ada push ke main (misal habis edit index.html)
  push:
    branches: [main]
  # Bisa dijalankan manual dari tab Actions di GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate halaman berita
        run: node scripts/generate-og.mjs

      - name: Commit & push hasil generate (kalau ada perubahan)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add berita/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan berita."
          else
            git commit -m "Auto-update halaman OG berita [skip ci]"
            git push
          fi
