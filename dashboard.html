<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Admin — Portal Desa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--dark:#17100c;--gold:#d6aa5b;--cream:#f2e5c9;--paper:#fffaf0;--green:#3f5c36;--line:#d1b88c;--text:#302318;--muted:#786750}
*{box-sizing:border-box}body{margin:0;background:#eee8dc;color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh}.top{background:var(--dark);color:#f5dfae;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:20}.brand{font-family:Georgia,serif;font-size:20px}.brand small{display:block;font:11px Arial;color:#cbb98e;margin-top:3px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #cbb185;background:#fff8e9;border-radius:8px;padding:9px 13px;color:#49351f}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.danger{background:#f7ded9;color:#7b261e;border-color:#e3b9b1}.btn.dark{background:#2e2118;color:#f6d999;border-color:#705334}
.layout{width:min(1240px,95%);margin:24px auto;display:grid;grid-template-columns:235px 1fr;gap:18px}.sidebar,.card{background:#fff;border:1px solid #d7c8ae;border-radius:14px;box-shadow:0 8px 22px #49351b12}.sidebar{padding:10px;height:max-content;position:sticky;top:88px}.nav-title{font-size:11px;color:#8a6b3b;font-weight:bold;letter-spacing:1.5px;padding:12px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:9px;color:#49351f}.nav:hover,.nav.active{background:#ead8b4}.content{min-width:0}.welcome{margin-bottom:18px}.welcome h1{margin:0 0 5px;font:600 28px Georgia,serif}.welcome p{margin:0;color:var(--muted);font-size:13px}.card{padding:20px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar h2{margin:0;font:600 22px Georgia,serif}.toolbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{border:1px solid #d4c2a5;border-radius:8px;padding:9px 11px;background:#fffdf8;min-width:220px}
.table-wrap{overflow:auto;border:1px solid #cfb487;border-radius:11px}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:11px;border-bottom:1px solid #eadfce;text-align:left;font-size:12px;vertical-align:middle}th{background:#3b2819;color:#f5d899;font-family:Georgia,serif}td{background:#fffaf0}.thumb{width:70px;height:48px;object-fit:cover;border-radius:7px;background:#dfd0b2}.actions{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-block;font-size:10px;padding:5px 8px;border-radius:12px;background:#e7d5b0;color:#64451e}.badge.pub{background:#cfe0c5;color:#2c5125}.empty{padding:35px;text-align:center;color:#79654a;background:#fffaf0;border:1px dashed #d4bd91;border-radius:11px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:100;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modal-box{background:#fffaf0;width:min(820px,97%);max-height:94vh;overflow:auto;border-radius:15px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{margin:0;font:600 22px Georgia,serif}.close{border:0;background:#eadfcf;border-radius:50%;width:34px;height:34px;font-size:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:4px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:bold;color:#70552f;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid #d4c2a5;border-radius:8px;background:#fffdf8}.field textarea{min-height:145px;resize:vertical}.hint{font-size:10px;color:#89765f;margin-top:5px}.preview{max-width:250px;max-height:160px;border-radius:9px;margin-top:8px;object-fit:cover}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;background:#24170f;color:#ffe0a0;border:1px solid #9b7438;border-radius:9px;padding:12px 17px;transition:.25s;z-index:300}.toast.show{opacity:1;transform:translate(-50%,0)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0f3d2e,#1e8449)}.login-card{background:white;width:min(420px,94%);padding:32px;border-radius:16px;box-shadow:0 15px 40px #0004}.login-card h1{text-align:center;font:600 25px Georgia,serif;color:#3f5c36;margin:0 0 8px}.login-card p{text-align:center;color:#777;font-size:13px;margin-bottom:25px}.login-card .field{margin-bottom:14px}.error{color:#b12c21;text-align:center;font-size:12px;margin-top:12px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:4px}.nav-title{display:none}.nav{white-space:nowrap;width:auto}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{padding:13px 15px}.layout{width:94%;margin:15px auto}.search{min-width:160px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal">
  <div class="modal-box">
    <div class="modal-head"><h2 id="modalTitle">Tambah Konten</h2><button class="close" onclick="closeModal()">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const SUPABASE_URL="https://nssrmpypcadjadxquxkx.supabase.co";
const SUPABASE_KEY="sb_publishable_Ga-3oYa9f_jPA-z199-u3Q_Zzu2TyDt";
const DRIVE_FOLDER_URL="https://drive.google.com/drive/u/1/folders/1_Q7sGE1RGLBNHW-EP3g_MeVQWow9idPc";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// Ubah link berbagi Google Drive (file/d/ID/view atau ?id=ID) menjadi link foto langsung yang bisa ditampilkan di <img>.
function driveToDirect(url){
  if(!url) return url;
  const m=url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/)||url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m&&m[1])return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1200`;
  return url;
}

const TYPES={
  berita:"Berita Desa",
  dokumentasi:"Dokumentasi",
  potensi:"Produk Potensi Desa",
  regulasi:"Regulasi Desa",
  template:"Template Administrasi Desa",
  sosialisasi:"Media Sosialisasi"
};

let currentType="berita";
let rows=[];
let editingId=null;
let currentUser=null;

const $=s=>document.querySelector(s);
function esc(v=""){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2800)}
function goSite(){location.href="index.html"}
function logout(){sb.auth.signOut().then(()=>location.href="admin.html")}

async function start(){
  const {data,error}=await sb.auth.getSession();
  if(error||!data.session){location.href="admin.html";return}
  currentUser=data.session.user;
  if(currentUser.app_metadata?.role!=="admin"){
    $("#root").innerHTML=`<div class="login" style="background:linear-gradient(135deg,#7b261e,#b12c21)"><div class="login-card">
      <h1 style="color:#7b261e">Akses ditolak</h1>
      <p>Akun <b>${esc(currentUser.email)}</b> belum memiliki role <b>admin</b> di Supabase (Authentication → Users → App Metadata → <code>{"role":"admin"}</code>).</p>
      <button class="btn danger" style="width:100%" onclick="logout()">Keluar</button>
    </div></div>`;
    return;
  }
  renderDashboard();
  loadRows();
}

function renderDashboard(){
  $("#root").innerHTML=`
  <div class="app">
    <header class="top">
      <div class="brand">PORTAL DESA <small>Dashboard Admin • Kecamatan Nagreg</small></div>
      <div class="top-actions">
        <span style="font-size:11px;align-self:center">${esc(currentUser.email)}</span>
        <a class="btn" href="${DRIVE_FOLDER_URL}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">🗂️ Google Drive</a>
        <button class="btn dark" onclick="goSite()">🌐 Website</button>
        <button class="btn danger" onclick="logout()">Keluar</button>
      </div>
    </header>
    <main class="layout">
      <aside class="sidebar">
        <div class="nav-title">KELOLA KONTEN</div>
        ${Object.entries(TYPES).map(([k,v])=>`<button class="nav ${k===currentType?"active":""}" onclick="selectType('${k}')">${icon(k)} ${v}</button>`).join("")}
      </aside>
      <section class="content">
        <div class="welcome">
          <h1>Dashboard Admin</h1>
          <p>Kelola isi Portal Desa tanpa mengubah kode website.</p>
        </div>
        <div class="card">
          <div class="toolbar">
            <h2>${TYPES[currentType]}</h2>
            <div class="right">
              <input class="search" id="search" placeholder="Cari konten..." oninput="drawTable()">
              <button class="btn primary" onclick="openEditor()">＋ Tambah</button>
            </div>
          </div>
          <div id="table">Memuat...</div>
        </div>
      </section>
    </main>
  </div>`;
}
function icon(k){return ({berita:"📰",dokumentasi:"📷",potensi:"🌾",regulasi:"📜",template:"📁",sosialisasi:"📢"})[k]||"•"}

function selectType(type){
  currentType=type;
  renderDashboard();
  loadRows();
}

async function loadRows(){
  $("#table").innerHTML="Memuat data...";
  const q=await sb.from("portal_content").select("*").eq("type",currentType).order("created_at",{ascending:false});
  if(q.error){$("#table").innerHTML=`<div class="empty">Gagal mengambil data: ${esc(q.error.message)}</div>`;return}
  rows=q.data||[];
  drawTable();
}

function drawTable(){
  const search=($("#search")?.value||"").toLowerCase().trim();
  const filtered=rows.filter(x=>
    !search ||
    String(x.title||"").toLowerCase().includes(search) ||
    String(x.category||"").toLowerCase().includes(search) ||
    String(x.village||"").toLowerCase().includes(search)
  );
  if(!filtered.length){$("#table").innerHTML=`<div class="empty">Belum ada konten ${TYPES[currentType].toLowerCase()}.</div>`;return}
  $("#table").innerHTML=`
  <div class="table-wrap"><table>
    <thead><tr><th>Foto</th><th>Judul</th><th>Kategori/Desa</th><th>Status</th><th>Tanggal</th><th>Aksi</th></tr></thead>
    <tbody>${filtered.map(x=>`
      <tr>
        <td>${x.image_url?`<img class="thumb" src="${esc(x.image_url)}" alt="">`:"📷"}</td>
        <td><b>${esc(x.title)}</b><br><small>${esc(x.code||"")}</small></td>
        <td>${esc(x.category||"-")}<br><small>${esc(x.village||"")}</small></td>
        <td>${x.status==="published"?'<span class="badge pub">Terbit</span>':'<span class="badge">Draft</span>'}</td>
        <td>${esc(x.date_text||"")}</td>
        <td><div class="actions">
          <button class="btn" onclick="openEditor('${x.id}')">Edit</button>
          <button class="btn" onclick="togglePublish('${x.id}','${x.status}')">${x.status==="published"?"Draft":"Terbit"}</button>
          <button class="btn danger" onclick="removeContent('${x.id}')">Hapus</button>
        </div></td>
      </tr>`).join("")}</tbody>
  </table></div>`;
}

function getRow(id){return rows.find(x=>String(x.id)===String(id))||{}}

function openEditor(id=null){
  const x=id?getRow(id):{};
  editingId=id;
  $("#modalTitle").textContent=(id?"Edit ":"Tambah ")+TYPES[currentType];
  $("#modalBody").innerHTML=`
  <form onsubmit="saveContent(event)">
    <div class="form-grid">
      <div class="field"><label>Kode</label><input id="f_code" value="${esc(x.code||"")}" placeholder="B001"></div>
      <div class="field"><label>Tanggal</label><input id="f_date" type="date" value="${esc(x.date_text||"")}"></div>
      <div class="field full"><label>Judul</label><input id="f_title" required value="${esc(x.title||"")}" placeholder="Judul konten"></div>
      <div class="field"><label>Kategori</label><input id="f_cat" value="${esc(x.category||"")}" placeholder="Kegiatan"></div>
      <div class="field"><label>Desa</label><input id="f_village" value="${esc(x.village||"")}" placeholder="Nama desa"></div>
      <div class="field full"><label>Ringkasan / Deskripsi / Nomor</label><textarea id="f_summary" placeholder="Ringkasan singkat...">${esc(x.summary||"")}</textarea></div>
      <div class="field full"><label>Isi berita / isi konten</label><textarea id="f_body" placeholder="Tulis isi konten di sini...">${esc(x.body||"")}</textarea></div>
      <div class="field full"><label>Link Drive / Link eksternal</label><input id="f_url" type="url" value="${esc(x.external_url||"")}" placeholder="https://..."></div>
      <div class="field full"><label>Link Foto Google Drive (cara utama)</label><input id="f_drive_photo" type="url" placeholder="https://drive.google.com/file/d/.../view">
        <div class="hint">Di Google Drive: klik kanan foto → <b>Dapatkan link</b> → set akses "Siapa saja yang memiliki link" → tempel di sini. Link otomatis diubah jadi foto langsung. Folder kerja: <a href="${DRIVE_FOLDER_URL}" target="_blank" rel="noopener">buka folder Drive ↗</a></div>
      </div>
      <div class="field full"><label>Atau upload langsung (opsional)</label><input id="f_file" type="file" accept="image/*" onchange="previewImage(event)">
        ${x.image_url?`<img id="prev" class="preview" src="${esc(x.image_url)}">`:`<img id="prev" class="preview" style="display:none">`}
        <input id="oldimg" type="hidden" value="${esc(x.image_url||"")}">
        <div class="hint">Jika diisi, file ini akan diunggah ke Supabase Storage bucket <b>portal-images</b> dan dipakai sebagai foto (mengalahkan link Drive di atas).</div>
      </div>
      <div class="field full"><label>URL PDF (opsional)</label><input id="f_pdf" type="url" value="${esc(x.pdf_url||"")}" placeholder="https://..."></div>
      <div class="field"><label>Status</label><select id="f_status">
        <option value="draft" ${x.status==="draft"||!x.status?"selected":""}>Draft</option>
        <option value="published" ${x.status==="published"?"selected":""}>Terbitkan</option>
      </select></div>
    </div>
    <div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary" type="submit">Simpan</button></div>
  </form>`;
  $("#modal").classList.add("open");
}
function closeModal(){$("#modal").classList.remove("open");editingId=null}
function previewImage(e){const f=e.target.files[0];if(f){const p=$("#prev");p.src=URL.createObjectURL(f);p.style.display="block"}}

async function saveContent(e){
  e.preventDefault();
  const saveBtn=e.submitter; saveBtn.disabled=true; saveBtn.textContent="Menyimpan...";
  try{
    let image=$("#oldimg").value||"";
    const file=$("#f_file").files[0];
    const driveVal=$("#f_drive_photo").value.trim();
    if(file){
      const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
      const path=`${currentType}/${crypto.randomUUID()}.${ext}`;
      const u=await sb.storage.from("portal-images").upload(path,file,{contentType:file.type,upsert:false});
      if(u.error)throw u.error;
      image=sb.storage.from("portal-images").getPublicUrl(path).data.publicUrl;
    }else if(driveVal){
      image=driveToDirect(driveVal);
    }
    const obj={
      code:$("#f_code").value.trim()||null,
      type:currentType,
      date_text:$("#f_date").value.trim(),
      title:$("#f_title").value.trim(),
      category:$("#f_cat").value.trim(),
      village:$("#f_village").value.trim(),
      summary:$("#f_summary").value.trim(),
      body:$("#f_body").value.trim(),
      external_url:$("#f_url").value.trim(),
      image_url:image,
      pdf_url:$("#f_pdf").value.trim(),
      status:$("#f_status").value
    };
    const q=editingId
      ?await sb.from("portal_content").update(obj).eq("id",editingId)
      :await sb.from("portal_content").insert(obj);
    if(q.error)throw q.error;
    closeModal(); toast("Konten berhasil disimpan"); loadRows();
  }catch(err){console.error(err);toast("Gagal: "+err.message);saveBtn.disabled=false;saveBtn.textContent="Simpan"}
}

async function togglePublish(id,status){
  const next=status==="published"?"draft":"published";
  const q=await sb.from("portal_content").update({status:next}).eq("id",id);
  if(q.error)toast("Gagal: "+q.error.message);else{toast(next==="published"?"Konten diterbitkan":"Konten menjadi draft");loadRows()}
}
async function removeContent(id){
  const x=getRow(id);
  if(!confirm(`Hapus konten "${x.title||""}"?`))return;
  const q=await sb.from("portal_content").delete().eq("id",id);
  if(q.error)toast("Gagal: "+q.error.message);else{toast("Konten dihapus");loadRows()}
}

start();
</script>
</body>
</html>
